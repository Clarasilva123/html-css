<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        body{
            font-family: 'Courier New', Courier, monospace;
        }
        table{
           border-collapse: collapse;
           width: 300px;
        }
        td{
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
    </style>
    <h1>Mesclagem de tabela</h1>
    <table>
        <tr>
            <td>A</td>
            <td colspan="2">B</td>
            
        </tr>
        <tr>
            <td rowspan="3">D</td>
             <td>E</td>
            <td>F</td>
        </tr>
        <tr>
            
             <td>H</td>
            <td>I</td>
        </tr>
        <tr>
            
             <td>L</td>
            <td>M</td>
        </tr>
    </table>
</body>
</html>
