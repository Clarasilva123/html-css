<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="cadastro" method="get"></form>
    <p>
        <label for="nome">Nome:</label>
        <input type="text" name="nome" id="nome" placeholder="Nome Completo" maxlength="30" required>
    </p>
    <p>
        <label for="media">Média:</label>
        <input type="number" name="media" id="media" min="0" max="10" placeholder="0 a 10" step="0.1">
    </p>
    <p>
        <label for="mes">Período letivo:</label>
        <input type="month" name="mes" id="mes">
    </p>
    <p>
        <label for="dia">Dia da prova:</label>
        <input type="date" name="dia" id="dia">
    </p>
    <p>
        <label for="hora">Hora da prova:</label>
        <input type="time" name="hora" id="hora">
    </p>
    <p>
        <input type="submit" value="enviar">
        <input type="reset" value="Limpar">
    </p>
    
</body>
</html>
